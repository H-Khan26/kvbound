# Hooks run the locked tool versions through uv so pre-commit, `make lint` and CI agree.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^python/
      - id: clang-format
        name: clang-format
        entry: uv run clang-format -i
        language: system
        files: \.(h|hpp|cpp|cu|cuh)$
