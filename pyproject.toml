[project]
name = "kvbound"
version = "0.1.0"
description = "Reference model, golden tensors, benchmarks and analysis for the kvbound inference engine."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.0",
    "safetensors>=0.4",
    "transformers>=4.45",
    "huggingface-hub>=0.25",
    "nvidia-ml-py>=12.560",
]

# Pick exactly one torch build: `uv sync --extra cu128` on GPU machines, `--extra cpu` in CI.
# Both pin the same version so reference numerics match; 2.11 is the newest with cu128 wheels
# for Linux and Windows (cu130 needs driver >= 580).
[project.optional-dependencies]
cpu = ["torch==2.11.*"]
cu128 = ["torch==2.11.*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3",
    "clang-format>=19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/kvbound"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests/py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "N806", "PLC0415"]

[tool.mypy]
python_version = "3.12"
files = ["python"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests/py"]
addopts = "-ra -m \"not slow and not gpu\""
markers = [
    "gpu: needs a CUDA GPU",
    "slow: needs real model weights or takes minutes",
]
