# Primary model. Gated: accept the license on Hugging Face and run `hf auth login` before fetching.
name = "llama-3.2-1b"
hf_repo = "meta-llama/Llama-3.2-1B"
revision = "main"  # pin to a commit sha when weights are first fetched
gated = true

# Lets the perf model run without the checkpoint; checked against config.json on load.
[arch]
vocab_size = 128256
hidden_size = 2048
n_layers = 16
n_heads = 32
n_kv_heads = 8
intermediate_size = 8192
tie_word_embeddings = true
