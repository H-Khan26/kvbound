# Ungated development model: same architecture family as Llama 3.2 (GQA, RoPE, SwiGLU).
name = "tinyllama-1.1b"
hf_repo = "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
revision = "fe8a4ea1ffedaf415f4da2f062534de366a451e6"
gated = false

# Lets the perf model run without the checkpoint; checked against config.json on load.
[arch]
vocab_size = 32000
hidden_size = 2048
n_layers = 22
n_heads = 32
n_kv_heads = 4
intermediate_size = 5632
tie_word_embeddings = false
