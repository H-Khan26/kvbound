name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Python environment (CPU torch)
        run: uv sync --locked --extra cpu

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Build and test (cpu preset)
        run: make test PRESET=cpu
